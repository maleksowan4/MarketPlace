services:
  auth-service:
    build:
      context: ./serverphp/auth-service
    container_name: auth-service-container
    ports:
      - "5001:5001"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 1434
      DB_NAME: MarketPlace
      DB_USER: marketplace_user
      DB_PASSWORD: NewStrongPassword@2026
    networks:
      - marketplace-network

  user-service:
    build:
      context: ./serverphp/user-service
    container_name: user-serivce-container
    ports:
      - "5002:5002"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 1434
      DB_NAME: MarketPlace
      DB_USER: marketplace_user
      DB_PASSWORD: NewStrongPassword@2026
    networks:
      - marketplace-network

  product-service:
    build:
      context: ./serverphp/product-service
    container_name: product-service-container
    ports:
      - "5003:5003"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 1434
      DB_NAME: MarketPlace
      DB_USER: marketplace_user
      DB_PASSWORD: NewStrongPassword@2026
    networks:
      - marketplace-network

  order-service:
    build:
      context: ./serverphp/order-service
    container_name: order-service-container
    ports:
      - "5004:5004"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 1434
      DB_NAME: MarketPlace
      DB_USER: marketplace_user
      DB_PASSWORD: NewStrongPassword@2026
      PRODUCT_SERVICE_URL: http://product-service:5003
      WALLET_SERVICE_URL: http://wallet-service:5005
    networks:
      - marketplace-network

  wallet-service:
    build:
      context: ./serverphp/wallet-service
    container_name: wallet-service-container
    ports:
      - "5005:5005"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 1434
      DB_NAME: MarketPlace
      DB_USER: marketplace_user
      DB_PASSWORD: NewStrongPassword@2026
    networks:
      - marketplace-network

  complaint-service:
    build:
      context: ./serverphp/complaint-service
    container_name: complaint-service-container
    ports:
      - "5006:5006"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 1434
      DB_NAME: MarketPlace
      DB_USER: marketplace_user
      DB_PASSWORD: NewStrongPassword@2026
      USER_SERVICE_URL: http://user-service:5002
    networks:
      - marketplace-network

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: api-gateway-container
    ports:
      - "5000:5000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:5001
      USER_SERVICE_URL: http://user-service:5002
      PRODUCT_SERVICE_URL: http://product-service:5003
      ORDER_SERVICE_URL: http://order-service:5004
      WALLET_SERVICE_URL: http://wallet-service:5005
      COMPLAINT_SERVICE_URL: http://complaint-service:5006
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
      - wallet-service
      - complaint-service
    networks:
      - marketplace-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://host.docker.internal:5000/api
    container_name: marketplace-frontend-container
    ports:
      - "3000:3000"
    networks:
      - marketplace-network

networks:
  marketplace-network:
    driver: bridge
